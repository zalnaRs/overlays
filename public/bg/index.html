<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <style>
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                font-family: Arial, Helvetica, sans-serif;
                background: #0a0a1a;
            }

            #aurora-container {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: -1;
            }

            .aurora {
                position: absolute;
                opacity: 0;
                filter: blur(60px);
                will-change: transform, opacity;
                transition: opacity 8s ease-in-out;
                border-radius: 50%;
                width: 100%;
                height: 100%;
            }

            #center-text {
                color: white;
                text-align: center;
                font-size: 3rem;
                font-weight: bold;
                text-shadow: 0 0 10px rgba(red, green, blue, 0.5);
                z-index: 10;
                padding: 20px;
                background-color: rgba(0, 0, 0, 0.3);
                border-radius: 15px;
                transition: all 0.5s ease;
                mix-blend-mode: screen;
            }

            @media (max-width: 768px) {
                #center-text {
                    font-size: 2rem;
                }
            }
        </style>
    </head>
    <body>
        <div id="aurora-container"></div>
        <script defer src="/bg/script.js"></script>
    </body>
</html>
