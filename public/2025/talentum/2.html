    <script>
      const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const paramssss = new URLSearchParams(location.search);

      const messages = [
        [
          "Budapesti Műszaki Szakképzési Centrum",
          "Puskás Tivadar Távközlési és Informatikai Technikum",
        ],
      ];

      document.querySelector("#a").innerHTML = paramssss.get("2");
      document.querySelector("#b").innerHTML = paramssss.get("1");

      async function cycle() {
        const headerFirst = document.querySelector("header h2");
        const headerSecond = document.querySelector("header h1");
        // ← this makes it loop forever
        for (const [line1, line2] of messages) {
          headerFirst.style.opacity = "0";
          headerSecond.style.opacity = "0";
          await delay(1000); // a bit longer fade-out looks nicer
          // change text while invisible
          headerFirst.innerHTML = line1;
          headerSecond.innerHTML = line2;

          // fade in
          headerFirst.style.opacity = "1";
          headerSecond.style.opacity = "1";
          await delay(15000); // visible time
        }
      }

      window.onload = () => {
        setTimeout(() => cycle(), 1);
      };
    </script>
