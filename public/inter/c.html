    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
        window.addEventListener("load", () => {
            const schoolA = "Budapesti Műszaki Szakképzési Centrum";
            const schoolB = "Puskás Tivadar Távközlési és Informatikai Technikum";
            const params = new URLSearchParams(window.location.search);
            const paramsA = params.get("b");
            const paramsB = params.get("a"); // this is swapped for obvious reasons

            let i = 0;

            function swap() {
                const a = document.querySelector("#a");
                const b = document.querySelector("#b");
                if (!a || !b) return;

                i = (i + 1) % 2;

                gsap.timeline()
                    .to([a, b], {
                        opacity: 0,
                        filter: "blur(8px)",
                        x: -8,
                        duration: 1,
                        ease: "expo.inOut"
                    })
                    .call(() => {
                        a.innerHTML = i === 0 ? schoolA : paramsA || schoolA;
                        b.innerHTML = i === 0 ? schoolB : paramsB || schoolB;
                    })
                    .set([a, b], { x: 8 })
                    .to([a, b], {
                        opacity: 1,
                        filter: "blur(0px)",
                        x: 0,
                        duration: 1,
                        ease: "expo.inOut"
                    });
            }

            // initial text, no animation
            (function initText() {
                const a = document.querySelector("#a");
                const b = document.querySelector("#b");
                if (!a || !b) return;
                a.innerHTML = schoolA;
                b.innerHTML = schoolB;
            })();

            setInterval(swap, 12000);
        });
    </script>
